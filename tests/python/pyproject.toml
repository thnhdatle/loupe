[project]
name = "loupe-sdk-tests"
version = "0.0.0"
description = "Pinned SDKs used by the Loupe examples and acceptance tests"
requires-python = "==3.12.*"
dependencies = [
  "openai==3.35.1",
  "httpx==0.28.1",
  "opentelemetry-sdk==1.45.1",
  "opentelemetry-exporter-otlp-proto-http==1.45.1",
  "opentelemetry-instrumentation-openai-v2==2.4b0",
  # 2.4b0 imports opentelemetry.util.genai.instruments, which 1.2b0 no longer ships.
  "opentelemetry-util-genai==1.1b0",
  "openinference-instrumentation-openai==0.1.65",
]

[tool.uv]
package = false
