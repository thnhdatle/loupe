#
# Cost fixture: 200 cases with hand-checked expected cost_nanos.
# Prices are USD per million tokens written as YAML scalar text and parsed as exact decimals
# (never float64). Expected values were computed independently of the Go code with Python
# Decimal arithmetic; each explanation shows the selected entry and the cost arithmetic of docs/guides/pricing.md:
#   count*price(term) in nano-USD per Mtok, numerator, numerator/1e6, half-up result.
# Span starts are RFC 3339 UTC; an effective_from is inclusive.
# kind: span  -> one span priced by the cost formula (checked by internal/domain/cost).
# kind: trace -> trace totals after the usage-duplicate rule.
#   cost_nanos sums counted (non-duplicate) spans, null when none is priced; unpriced_spans
#   counts counted spans with tokens and no cost; calls counts counted llm/embedding spans.
