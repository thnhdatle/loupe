apiVersion: v1
kind: Service
metadata:
  name: loupe
  labels:
    app.kubernetes.io/name: loupe
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: loupe
  ports:
    - name: grpc
      port: 4317
      targetPort: grpc
    - name: http
      port: 4318
      targetPort: http
    - name: ui
      port: 3000
      targetPort: ui
    - name: admin
      port: 9092
      targetPort: admin
