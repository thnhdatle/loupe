name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: scripts/ci-install-tools.sh
      # The examples and the quickstart need the released
      # fakellm and triage images; a missing image fails here instead of
      # skipping criteria.
      # - name: Pull the sibling images
      #   run: |
      #     docker pull ghcr.io/thnhdatle/fakellm:v0.1.0
      #     docker pull ghcr.io/thnhdatle/triage:v0.1.0
      - run: make bootstrap
      - run: make lint test
      # - run: make quickstart-test
      # - run: make release-dry
